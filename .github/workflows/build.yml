name: Build Jason Kernel with KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    name: Build KernelSU-Next for Jason
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout AnyKernel3 Template
      uses: actions/checkout@v4
      with:
        repository: osm0sis/AnyKernel3
        path: AnyKernel3

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev git zip curl wget python3 libncurses5-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

    - name: Download AOSP Clang 18 (r510928)
      run: |
        git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r510928.git clang

    - name: Clone Jason Kernel Source (LineageOS 21.0 / 4.4)
      run: |
        git clone --depth=1 -b lineage-21-4.4 https://github.com/LineageOS-jason/android_kernel_xiaomi_sdm660.git kernel

    - name: Integrate KernelSU-Next (Legacy Branch)
      run: |
        cd kernel
        curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

        # 兼容 4.4 旧内核：补齐缺失的子头文件垫片并穿透软链接就地安全替换
        python3 -c "
        import os

        os.makedirs('include/linux/sched', exist_ok=True)
        with open('include/linux/compiler_types.h', 'w') as f:
            f.write('#ifndef __LINUX_COMPILER_TYPES_H\n#define __LINUX_COMPILER_TYPES_H\n#include <linux/compiler.h>\n#endif\n')

        for h in ['signal.h', 'task.h', 'task_stack.h', 'mm.h', 'user.h']:
            p = os.path.join('include/linux/sched', h)
            guard = f'__LINUX_SCHED_{h.replace(".", "_").upper()}__'
            with open(p, 'w') as f:
                f.write(f'#ifndef {guard}\n#define {guard}\n#include <linux/sched.h>\n#endif\n')

        for root, dirs, files in os.walk('.', followlinks=True):
            if '.git' in root or 'out' in root:
                continue
            for file in files:
                if file.endswith(('.c', '.h')):
                    fp = os.path.join(root, file)
                    try:
                        with open(fp, 'r', encoding='utf-8', errors='ignore') as f:
                            c = f.read()
                        if '<linux/sched/signal.h>' in c or '<linux/compiler_types.h>' in c:
                            c = c.replace('<linux/sched/signal.h>', '<linux/sched.h>')
                            c = c.replace('<linux/compiler_types.h>', '<linux/compiler.h>')
                            with open(fp, 'w', encoding='utf-8') as f:
                                f.write(c)
                            print(f'Patched {fp}')
                    except Exception as e:
                        pass
        "

        # SELinux C90 声明置顶
        python3 -c "
        path = 'security/selinux/hooks.c'
        with open(path, 'r') as f:
            c = f.read()
        target = '''\tint nnp = (bprm->unsafe & LSM_UNSAFE_NO_NEW_PRIVS);
        \tint nosuid = (bprm->file->f_path.mnt->mnt_flags & MNT_NOSUID);
        \tint rc;

        \tif (!nnp && !nosuid)
        \t\treturn 0; /* neither NNP nor nosuid */

        \tif (new_tsec->sid == old_tsec->sid)
        \t\treturn 0; /* No change in credentials */'''
        replacement = '''\tstatic u32 ksu_sid;
        \tchar *secdata;
        \tint nnp = (bprm->unsafe & LSM_UNSAFE_NO_NEW_PRIVS);
        \tint nosuid = (bprm->file->f_path.mnt->mnt_flags & MNT_NOSUID);
        \tint rc, error;
        \tu32 seclen;

        \tif (!nnp && !nosuid)
        \t\treturn 0; /* neither NNP nor nosuid */

        \tif (new_tsec->sid == old_tsec->sid)
        \t\treturn 0; /* No change in credentials */

        \tif (!ksu_sid)
        \t\tsecurity_secctx_to_secid("u:r:su:s0", strlen("u:r:su:s0"), &ksu_sid);

        \terror = security_secid_to_secctx(old_tsec->sid, &secdata, &seclen);
        \tif (!error) {
        \t\trc = strcmp("u:r:init:s0", secdata);
        \t\tsecurity_release_secctx(secdata, seclen);
        \t\tif (rc == 0 && new_tsec->sid == ksu_sid)
        \t\t\treturn 0;
        \t}'''
        if 'ksu_sid' not in c and target in c:
            c = c.replace(target, replacement)
            with open(path, 'w') as f:
                f.write(c)
        "

        echo "CONFIG_KSU=y" >> arch/arm64/configs/jason_defconfig
        echo "CONFIG_KPROBES=y" >> arch/arm64/configs/jason_defconfig
        echo "CONFIG_HAVE_KPROBES=y" >> arch/arm64/configs/jason_defconfig
        echo "CONFIG_KPROBE_EVENTS=y" >> arch/arm64/configs/jason_defconfig
        echo "CONFIG_OVERLAY_FS=y" >> arch/arm64/configs/jason_defconfig

    - name: Compile Kernel
      run: |
        export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"
        cd kernel
        make O=out ARCH=arm64 jason_defconfig
        make -j$(nproc --all) O=out ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
          Image.gz-dtb

    - name: Package with AnyKernel3
      run: |
        cp kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
        cd AnyKernel3
        sed -i 's/device.name1=.*/device.name1=jason/' anykernel.sh
        sed -i 's/supported.versions=.*/supported.versions=14/' anykernel.sh
        sed -i 's/BLOCK=.*/BLOCK=\/dev\/block\/bootdevice\/by-name\/boot/' anykernel.sh
        zip -r9 ../AnyKernel3-KernelSU-Next-jason.zip * -x .git README.md *placeholder

    - name: Upload KernelSU-Next Flashable Zip
      uses: actions/upload-artifact@v4
      with:
        name: AnyKernel3-KernelSU-Next-jason
        path: AnyKernel3-KernelSU-Next-jason.zip
